
[project]
name = "sck-core-framework"
version = "0.1.2-pre.12+2fec456"
description = "Core-Framework for Core-Automation"
authors = [{ name = "James Barwick", email = "jbarwic@me.com" }]
license = "GPL-3.0-only"
readme = "README.md"
maintainers = [{ name = "James Barwick", email = "jbarwic@me.com" }]
keywords = ["sck", "core", "aws", "cloud", "automation"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3 (>=1.34.51,<1.35.0)",
    "botocore (>=1.34.51,<1.35.0)",
    "netaddr (>=1.3.0,<2.0.0)",
    "ruamel-yaml (>=0.18.10,<0.19.0)",
    "filters (>=1.3.2,<1.4.0)",
    "deepdiff (>=7.0.1,<8.0.0)",
    "jinja2 (>=3.1.4,<3.2.0)",
    "jmespath (>=1.0.1,<1.1.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
]

[tool.poetry]

packages = [
    { include = "core_framework" },
    { include = "core_renderer" },
    { include = "core_logging" },
    { include = "core_helper" },
]

[project.optional-dependencies]
dev = [
    "boto3-stubs (>=1.34.51,<1.35.0)",
    "types-tabulate (>=0.9.0.20240106,<0.10.0)",
    "flake8 (>=7.1.1,<8.0.0)",
    "cfn-lint (>=1.22.3,<1.23.0)",
    "pytest (>=8.3.3,<9.0.0)",
    "pytest-asyncio (>=0.25.0,<0.26.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
    "rstcheck (>=6.2.4,<7.0.0)",
    "pylance (>=0.21.0,<0.22.0)",
    "types-netaddr (>=1.3.0.20240530,<1.4.0)",
]

[tool.poetry-dynamic-versioning]
enable = true
bump = true
ignore-untracked = true
style = "semver"
substitution = { files = ["core_framework/__init__.py"] }

[tool.black]
line-length = 132
target-version = ["py311"]
skip-string-normalization = true
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
  | venv
  | \.venv
)/
'''
extend-exclude = '''
/(
    tests
)/
'''

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[dependency-groups]
dev = ["black (>=25.9.0,<26.0.0)"]
