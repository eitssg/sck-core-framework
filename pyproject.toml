
[project]
name = "sck-core-framework"
version = "1.3.0"
description = "Core-Framework for Core-Automation"
authors = [{ name = "James Barwick", email = "jbarwick@eits.com.sg" }]
license = "GPL-3.0-only"
readme = "README.md"
maintainers = [{ name = "James Barwick", email = "jbarwick@eits.com.sg" }]
keywords = ["sck", "core", "aws", "cloud", "automation"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3 (>=1.34.51,<1.35.0)",
    "botocore (>=1.34.51,<1.35.0)",
    "netaddr (>=1.3.0,<2.0.0)",
    "ruamel-yaml (>=0.18.10,<0.19.0)",
    "filters (>=1.3.2,<1.4.0)",
    "deepdiff (>=7.0.1,<8.0.0)",
    "jinja2 (>=3.1.4,<3.2.0)",
    "jmespath (>=1.0.1,<1.1.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
    "pydantic>=2.10,<2.11",
]

[tool.hatch.build.targets.wheel]
packages = ["core_framework", "core_renderer", "core_logging", "core_helper"]

[project.optional-dependencies]
dev = [
    "boto3-stubs (>=1.34.51,<1.35.0)",
    "types-tabulate",
    "flake8",
    "cfn-lint (>=1.39.1)",
    "pytest",
    "pytest-asyncio (>=1.2.0)",
    "pytest-dotenv",
    "pytest-cov (>=7.0.0)",
    "rstcheck",
    "pylance (>=0.37.0)",
    "types-netaddr",
    "black>=25.9.0",
]


[tool.black]
line-length = 132
target-version = ["py311"]
skip-string-normalization = true
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
  | venv
  | \.venv
)/
'''
extend-exclude = '''
/(
    tests
)/
'''

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
